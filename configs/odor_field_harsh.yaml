# 実験12: 苛烈な viability 環境。エネルギー収支をタイトにして
# 「no_h が死に始める regime で GA-full が生存するか＝h の質的 viability 優位」を問う。
# odor_field_viability.yaml をベースに代謝/移動コストを約2倍、摂食効率と再生を下げた。
# GA(run_ga_viability)が use_h を full/no_h で切り替えて同一環境・同一適応度で最適化する。
environment:
  alpha_adapt: 0.015
  food_sensor_sigma: 4.0
  odor_decay_rate: 0.004
  odor_noise_strength: 0.04
  odor_sensor_sigma: 3.5
  patch_regen_rate: 0.007        # 0.010 -> 0.008 (再生を遅く)
  patches:
  - {center: [5.0, 6.0], depletion_rate: 0.08, max_food: 0.5, radius: 1.2}
  - {center: [10.0, 3.0], depletion_rate: 0.07, max_food: 0.4, radius: 1.0}
  - {center: [18.0, 5.0], depletion_rate: 0.09, max_food: 0.55, radius: 1.3}
  - {center: [26.0, 8.0], depletion_rate: 0.08, max_food: 0.4, radius: 1.0}
  - {center: [3.0, 15.0], depletion_rate: 0.07, max_food: 0.45, radius: 1.2}
  - {center: [13.0, 13.0], depletion_rate: 0.08, max_food: 0.55, radius: 1.5}
  - {center: [22.0, 14.0], depletion_rate: 0.07, max_food: 0.4, radius: 1.0}
  - {center: [7.0, 23.0], depletion_rate: 0.08, max_food: 0.5, radius: 1.3}
  - {center: [16.0, 25.0], depletion_rate: 0.09, max_food: 0.45, radius: 1.2}
  - {center: [25.0, 22.0], depletion_rate: 0.07, max_food: 0.4, radius: 1.0}
  risk_center: [14.0, 8.0]
  risk_noise_prob: 0.03
  risk_noise_strength: 0.3
  risk_radius: 1.5
  risk_sensor_sigma: 1.4
  risk_strength: 0.6
  start_heading: 0.3
  start_pos: [15.0, 15.0]
  step_size: 0.7
  turn_angle: 0.45
  type: odor_field
  world_size: 30.0
  # --- viability / metabolism (harsh) ---
  energy_enabled: true
  energy_max: 1.0
  energy_init: 1.0
  metabolic_cost: 0.0025         # 0.0008 -> 0.0016 (2x)
  move_cost_coef: 0.0050         # 0.0015 -> 0.0030 (2x)
  energy_gain_coef: 1.2          # 1.5 -> 1.3 (摂食効率↓)
model:
  alpha_h: 0.04
  alpha_m: 0.4
  h_dim: 2
  init_mode: handtuned
  m_dim: 3
  obs_dim: 3
  use_h: true
  use_m: true
seed: 7
simulation:
  output_dir: outputs/t2_harsh/full
  steps: 2000
